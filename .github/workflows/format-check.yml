name: Format check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -sSL "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Check formatting
        run: shfmt -d .

  dprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dprint
        run: |
          curl -sSL "https://github.com/dprint/dprint/releases/download/0.55.2/dprint-x86_64-unknown-linux-gnu.zip" -o dprint.zip
          unzip -o dprint.zip -d /usr/local/bin
          rm dprint.zip

      - name: Check formatting
        run: dprint check
